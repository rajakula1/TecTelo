<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="rectGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Base badge -->
  <rect x="10" y="10" width="100" height="100" rx="24" fill="url(#rectGrad)" stroke="url(#accentGrad)" stroke-width="4"/>
  <!-- Architectural 'T' -->
  <path d="M34 42H86M60 42V84" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Agent Nodes -->
  <circle cx="38" cy="74" r="7" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="82" cy="74" r="7" fill="#818cf8" filter="url(#glow)"/>
  <!-- Synaptic connection traces -->
  <line x1="38" y1="74" x2="60" y2="84" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3" opacity="0.85"/>
  <line x1="82" y1="74" x2="60" y2="84" stroke="#818cf8" stroke-width="2" stroke-dasharray="3 3" opacity="0.85"/>
</svg>
