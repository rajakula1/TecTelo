<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" rx="16" fill="url(#bgGrad5)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Medical Cross Shield Shield Motif -->
  <g transform="translate(60, 50)">
    <rect x="0" y="0" width="100" height="130" rx="16" fill="#090d16" stroke="#10b981" stroke-width="2"/>
    <!-- Cross -->
    <rect x="42" y="25" width="16" height="50" rx="4" fill="#10b981"/>
    <rect x="25" y="42" width="50" height="16" rx="4" fill="#10b981"/>
    <text x="50" y="105" text-anchor="middle" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">HIPAA BAA</text>
  </g>

  <!-- FHIR / HL7 & Security Nodes -->
  <g transform="translate(190, 50)">
    <rect x="0" y="0" width="160" height="35" rx="6" fill="#090d16" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="12" y="22" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">FHIR R4 / HL7 v2</text>
  </g>
  <g transform="translate(190, 95)">
    <rect x="0" y="0" width="160" height="35" rx="6" fill="#090d16" stroke="#818cf8" stroke-width="1.5"/>
    <text x="12" y="22" fill="#818cf8" font-family="'JetBrains Mono', monospace" font-size="11">Grounded Clinical RAG</text>
  </g>
  <g transform="translate(190, 140)">
    <rect x="0" y="0" width="160" height="35" rx="6" fill="#090d16" stroke="#10b981" stroke-width="1.5"/>
    <text x="12" y="22" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11">Deterministic Fallbacks</text>
  </g>
</svg>
