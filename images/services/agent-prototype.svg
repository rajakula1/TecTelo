<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="glowGrad2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" rx="16" fill="url(#bgGrad2)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Agent State Machine / Mesh -->
  <rect x="40" y="90" width="90" height="60" rx="10" fill="#090d16" stroke="#38bdf8" stroke-width="2"/>
  <text x="85" y="118" text-anchor="middle" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">PLANNER</text>
  <text x="85" y="135" text-anchor="middle" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Decompose</text>

  <rect x="160" y="40" width="90" height="60" rx="10" fill="#090d16" stroke="#818cf8" stroke-width="2"/>
  <text x="205" y="68" text-anchor="middle" fill="#818cf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">TOOL CALL</text>
  <text x="205" y="85" text-anchor="middle" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">API / SQL</text>

  <rect x="160" y="140" width="90" height="60" rx="10" fill="#090d16" stroke="#c084fc" stroke-width="2"/>
  <text x="205" y="168" text-anchor="middle" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">RAG GATE</text>
  <text x="205" y="185" text-anchor="middle" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Grounding</text>

  <rect x="280" y="90" width="80" height="60" rx="10" fill="#090d16" stroke="#10b981" stroke-width="2"/>
  <text x="320" y="118" text-anchor="middle" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">VERIFY</text>
  <text x="320" y="135" text-anchor="middle" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Structured</text>

  <!-- Directed Edges -->
  <path d="M130 110 L160 80" stroke="url(#glowGrad2)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M130 130 L160 160" stroke="url(#glowGrad2)" stroke-width="2"/>
  <path d="M250 80 L280 110" stroke="url(#glowGrad2)" stroke-width="2"/>
  <path d="M250 160 L280 130" stroke="url(#glowGrad2)" stroke-width="2"/>
</svg>
